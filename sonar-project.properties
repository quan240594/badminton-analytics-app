# For a local scan, run scripts/sonar-scan.sh (reads the token from the
# gitignored .env.sonar.local - see that script's header for one-time setup).
sonar.organization=quan240594
sonar.projectKey=quan240594_badminton-analytics-app
sonar.projectName=Badminton Analytics App

sonar.sources=client/src,server,data
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,client/src/setupTests.js,data/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,client/public/data.json,data/pages/**,data/*.json,data/*.state.json,data/*.log,data/.venv/**,data/__pycache__/**,agent-contexts/**,data/badminton.html

sonar.sourceEncoding=UTF-8

# See https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/javascript-typescript-test-coverage
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info

# Produced by `pytest --cov --cov-report=xml:coverage.xml` from the repo root (see .coveragerc).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
