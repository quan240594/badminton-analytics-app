name: Install Playwright Chromium
description: Install Chromium and its system packages.

runs:
  using: composite
  steps:
    - shell: bash
      # No kill-and-retry on a slow install: the retries found the dpkg lock still held by apt-get and failed at once.
      run: |
        echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        playwright install --with-deps chromium
