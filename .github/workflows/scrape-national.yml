name: National pool scrape (incremental)

on:
  schedule:
    # Only the daily kickoff - a single tick a day is reliable. From there the
    # job chains itself (see the last step) instead of relying on further cron
    # ticks, since sub-hourly cron was tried before and GitHub silently
    # drops/delays most ticks on a lower-priority queue like this repo's.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore today''s budget for this run (manual catch-up)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: national-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Each run only ever does ~15 min of real work (see the time-boxed loop
    # below) plus setup/login overhead - this ceiling is just a safety margin,
    # never meant to be hit. Long-lived single runs used to get silently
    # killed by GitHub after ~5.5h regardless of this setting; short, chained
    # runs avoid that entirely.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.DATA_FETCHING_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright
        working-directory: data

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Log in and capture session cookie
        env:
          TOERNOOI_USERNAME: ${{ secrets.TOERNOOI_USERNAME }}
          TOERNOOI_PASSWORD: ${{ secrets.TOERNOOI_PASSWORD }}
        run: python3 playwright_login.py --save cookie.txt
        working-directory: data

      # Fetches pools back-to-back for at most 15 minutes (no in-process sleep),
      # committing+pushing after each one so a hard stop only loses whichever
      # single pool was in flight. Stops early on exit code 3 (today's budget or
      # the whole pool list is exhausted, see scrape_all_pools.py) or a real
      # failure (any other non-zero exit).
      - name: Scrape pools for up to 15 minutes
        id: scrape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          deadline=$(( $(date +%s) + 15 * 60 ))
          code=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            (cd data && python3 scrape_all_pools.py $FORCE_FLAG)
            code=$?
            set -e

            git add data/career.json data/career.state.json data/events_index.json data/fetched_pools.json data/pool_rosters.json data/player_fixed_status.json data/team_fixed_status_fetched.json data/scrape_daily_budget.json
            git diff --cached --quiet || git commit -m "chore(data): national scrape progress"

            # An unrelated commit landing on main mid-run shouldn't kill the whole
            # run - rebase onto the latest main and retry the push once.
            if ! git push; then
              git pull --rebase origin main
              git push
            fi

            if [ "$code" -ne 0 ]; then
              break
            fi
          done

          echo "code=$code" >> "$GITHUB_OUTPUT"

          # 0 (still more to do) and 3 (nothing left today) are both clean stops -
          # anything else is a real scraper failure and must fail the run loudly,
          # not get silently swallowed as green.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "scrape_all_pools.py failed (exit $code) - failing this run." >&2
            exit "$code"
          fi

      - name: Remove session cookie
        if: always()
        run: rm -f data/cookie.txt

      # code 0 means the 15-min window ran out while pools/budget still remain -
      # hand off to a fresh run instead of sleeping in place. code 3 (nothing
      # left for today) or a real failure both stop the chain here.
      - name: Trigger the next chained run
        if: steps.scrape.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape-national.yml --ref main
