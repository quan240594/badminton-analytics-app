name: National pool scrape (incremental)

on:
  schedule:
    # Only the daily kickoff - a single tick a day is reliable. From there the
    # job chains itself (see the last step) instead of relying on further cron
    # ticks, since sub-hourly cron was tried before and GitHub silently
    # drops/delays most ticks on a lower-priority queue like this repo's.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore today''s budget for this run (manual catch-up)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: national-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Each run only ever does ~15 min of real work (see the time-boxed loop
    # below) plus setup/login overhead - this ceiling is just a safety margin,
    # never meant to be hit. Long-lived single runs used to get silently
    # killed by GitHub after ~5.5h regardless of this setting; short, chained
    # runs avoid that entirely.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.DATA_FETCHING_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright
        working-directory: data

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Log in and capture session cookie
        env:
          TOERNOOI_USERNAME: ${{ secrets.TOERNOOI_USERNAME }}
          TOERNOOI_PASSWORD: ${{ secrets.TOERNOOI_PASSWORD }}
        # The site sometimes times out loading a page; a failed run never chains, so retry.
        run: |
          for attempt in 1 2 3; do
            python3 playwright_login.py --save cookie.txt && exit 0
            echo "login attempt $attempt failed" >&2
            sleep 20
          done
          exit 1
        working-directory: data

      # Each iteration fetches one pending pool, then re-reads the players of
      # pools whose results changed (refresh_league_results.py, in slices of at
      # most 5 minutes), committing+pushing after each so a hard stop only
      # loses one slice. Stops early once both drivers exit 3 (nothing left)
      # or on a real failure (any other non-zero exit).
      - name: Scrape pools for up to 15 minutes
        id: scrape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          deadline=$(( $(date +%s) + 15 * 60 ))
          code=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            (cd data && python3 scrape_all_pools.py $FORCE_FLAG)
            pools_code=$?
            slice_minutes=$(( (deadline - $(date +%s)) / 60 ))
            [ "$slice_minutes" -gt 5 ] && slice_minutes=5
            [ "$slice_minutes" -lt 1 ] && slice_minutes=1
            (cd data && python3 refresh_league_results.py --cookie-file cookie.txt --slice-minutes "$slice_minutes" $FORCE_FLAG)
            refresh_code=$?
            # Ranking links only exist on whichever player pages this iteration
            # just (re-)fetched (data/pages/ isn't persisted between runs), so
            # this only ever looks up new/just-scraped players - never a full
            # rescan - keeping each iteration's added work small and bounded.
            (cd data && python3 fetch_rankings.py --cookie-file cookie.txt)
            (cd data && python3 parse_rankings.py)
            set -e

            git add data/career.json data/career.state.json data/events_index.json data/fetched_pools.json data/pool_rosters.json data/player_fixed_status.json data/team_fixed_status_fetched.json data/scrape_daily_budget.json data/league_results_state.json
            [ -f data/rankings.json ] && git add data/rankings.json
            git diff --cached --quiet || git commit -m "chore(data): national scrape progress"

            # An unrelated commit landing on main mid-run shouldn't kill the whole
            # run - rebase onto the latest main and retry. GitHub also sometimes answers
            # a push with a 5xx, and a failed run never chains, so try a few times.
            pushed=false
            for attempt in 1 2 3 4; do
              if git push; then
                pushed=true
                break
              fi
              git pull --rebase origin main || true
              sleep $(( attempt * 10 ))
            done
            if [ "$pushed" != true ]; then
              echo "git push failed after 4 attempts" >&2
              exit 1
            fi

            code=0
            if [ "$pools_code" -ne 0 ] && [ "$pools_code" -ne 3 ]; then
              code="$pools_code"
              break
            fi
            if [ "$refresh_code" -ne 0 ] && [ "$refresh_code" -ne 3 ]; then
              code="$refresh_code"
              break
            fi
            if [ "$pools_code" -eq 3 ] && [ "$refresh_code" -eq 3 ]; then
              code=3
              break
            fi
          done

          echo "code=$code" >> "$GITHUB_OUTPUT"

          # 0 (still more to do) and 3 (nothing left today) are both clean stops -
          # anything else is a real scraper failure and must fail the run loudly,
          # not get silently swallowed as green.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "A scrape driver failed (exit $code) - failing this run." >&2
            exit "$code"
          fi

      - name: Remove session cookie
        if: always()
        run: rm -f data/cookie.txt

      # code 0 means the 15-min window ran out while pools/budget still remain -
      # hand off to a fresh run instead of sleeping in place. code 3 (nothing
      # left for today) or a real failure both stop the chain here.
      - name: Trigger the next chained run
        if: steps.scrape.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape-national.yml --ref main
