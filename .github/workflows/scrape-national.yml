name: National pool scrape (incremental)

on:
  schedule:
    # Daily 02:00 UTC - deliberately not deploy.yml's Friday 06:00 UTC slot.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Wall-clock time budget for this run (minutes)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: national-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DATA_FETCHING_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright
        working-directory: data

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Log in and capture session cookie
        env:
          TOERNOOI_USERNAME: ${{ secrets.TOERNOOI_USERNAME }}
          TOERNOOI_PASSWORD: ${{ secrets.TOERNOOI_PASSWORD }}
        run: python3 playwright_login.py --save cookie.txt
        working-directory: data

      - name: Scrape pending pools within time budget
        run: python3 scrape_all_pools.py --minutes "${{ github.event.inputs.minutes || '110' }}"
        working-directory: data

      - name: Remove session cookie before committing
        run: rm -f data/cookie.txt

      - name: Commit and push progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/career.json data/career.state.json data/events_index.json data/fetched_pools.json
          git diff --cached --quiet || git commit -m "chore(data): national scrape progress"
          git push
