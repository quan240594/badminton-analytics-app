name: National pool scrape (incremental)

on:
  schedule:
    # Every 10 min, 08:00-15:59 UTC ("day" starts 08:00, per scrape_all_pools.py's
    # own --day-start-hour). This window is a generous outer bound, not the real
    # throttle - each tick fetches at most one pool and the script's own persisted
    # daily budget (120 real scraping minutes/day) is what actually caps work; the
    # "pause" between pools is simply the gap between ticks, so it costs nothing.
    - cron: '*/10 8-15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Fetch a pool even if today''s budget is already used up'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: national-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # one pool (a few min typically, more for a large pool) + login/setup overhead
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DATA_FETCHING_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright
        working-directory: data

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Log in and capture session cookie
        env:
          TOERNOOI_USERNAME: ${{ secrets.TOERNOOI_USERNAME }}
          TOERNOOI_PASSWORD: ${{ secrets.TOERNOOI_PASSWORD }}
        run: python3 playwright_login.py --save cookie.txt
        working-directory: data

      - name: Scrape one pending pool against today's budget
        run: python3 scrape_all_pools.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        working-directory: data

      - name: Remove session cookie before committing
        run: rm -f data/cookie.txt

      - name: Commit and push progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/career.json data/career.state.json data/events_index.json data/fetched_pools.json data/pool_rosters.json data/player_fixed_status.json data/team_fixed_status_fetched.json data/scrape_daily_budget.json
          git diff --cached --quiet || git commit -m "chore(data): national scrape progress"
          git push
